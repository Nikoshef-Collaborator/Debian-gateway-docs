# gateway.conf - общие настройки шлюза. Читают скрипты из /usr/local/sbin.

# Режим: inverse = всё через VPN, напрямую только РФ (основной режим)
MODE="inverse"

# LAN
LAN_ADDR="192.168.50.1"
LAN_NET="192.168.50.0/24"

# Каскад дефолтной полосы: первый живой слот получает трафик.
# Имена ОБЯЗАНЫ совпадать с реальными интерфейсами (ip -br link)!
VPN_CASCADE_ORDER="vpn-main vpn-backup"

# Списки РФ (что оставлять напрямую). Обновляет gw-feeder раз в сутки.
RU_DOMAINS_URL="https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/outside-dnsmasq-nfset.lst"
RU_CIDR_URL="https://raw.githubusercontent.com/jinndi/geoip-ru-ipset/main/data/ru-no-blocked.txt"

# Голосовые подсети мессенджеров -> полоса VPS (0x200)
VOICE_CIDR_URLS="https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/discord.lst https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/telegram.lst https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/meta.lst"

# Группы доменов для переноса одной командой (gw-domain-move youtube direct)
SERVICE_GROUP_URLS="youtube:https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Services/youtube.lst"
